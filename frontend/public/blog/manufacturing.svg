<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solar cell and module manufacturing illustration">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/><stop offset="55%" stop-color="#123A63"/><stop offset="100%" stop-color="#0C2A4A"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/><stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FD0C9"/><stop offset="100%" stop-color="#1E7F8C"/>
    </linearGradient>
    <radialGradient id="glow2" cx="18%" cy="16%" r="50%">
      <stop offset="0%" stop-color="#3FD0C9" stop-opacity="0.24"/><stop offset="100%" stop-color="#3FD0C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg2)"/>
  <rect width="1200" height="800" fill="url(#dots2)"/>
  <rect width="1200" height="800" fill="url(#glow2)"/>

  <!-- stacked wafers -->
  <g>
    <rect x="150" y="470" width="300" height="46" rx="8" fill="#1B4E7A" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
    <rect x="168" y="410" width="300" height="46" rx="8" fill="#20618F" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="3"/>
    <rect x="186" y="350" width="300" height="46" rx="8" fill="url(#teal2)" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3"/>
  </g>
  <text x="300" y="576" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="3">CELLS</text>

  <!-- arrow -->
  <path d="M520 420 L640 420" stroke="url(#gold2)" stroke-width="10" stroke-linecap="round"/>
  <path d="M612 392 L648 420 L612 448 Z" fill="url(#gold2)"/>

  <!-- finished module -->
  <g transform="translate(700,300)">
    <rect x="-8" y="-8" width="376" height="256" rx="14" fill="#0A2540" stroke="url(#gold2)" stroke-width="5"/>
    <g fill="url(#gold2)" opacity="0.9">
      <rect x="18"  y="18"  width="76" height="52" rx="5"/>
      <rect x="106" y="18"  width="76" height="52" rx="5"/>
      <rect x="194" y="18"  width="76" height="52" rx="5"/>
      <rect x="18"  y="82"  width="76" height="52" rx="5"/>
      <rect x="106" y="82"  width="76" height="52" rx="5"/>
      <rect x="194" y="82"  width="76" height="52" rx="5"/>
      <rect x="18"  y="146" width="76" height="52" rx="5"/>
      <rect x="106" y="146" width="76" height="52" rx="5"/>
      <rect x="194" y="146" width="76" height="52" rx="5"/>
    </g>
  </g>
  <text x="888" y="616" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="3">MODULE</text>

  <!-- factory skyline hint -->
  <g fill="#FFFFFF" fill-opacity="0.10">
    <rect x="120" y="646" width="960" height="14" rx="7"/>
  </g>
</svg>
