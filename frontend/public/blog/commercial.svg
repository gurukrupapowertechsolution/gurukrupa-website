<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Commercial and industrial rooftop solar illustration">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/><stop offset="55%" stop-color="#11375E"/><stop offset="100%" stop-color="#0C2A4A"/>
    </linearGradient>
    <linearGradient id="gold5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/><stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <radialGradient id="glow5" cx="24%" cy="14%" r="52%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.22"/><stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots5" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg5)"/>
  <rect width="1200" height="800" fill="url(#dots5)"/>
  <rect width="1200" height="800" fill="url(#glow5)"/>

  <!-- sun -->
  <circle cx="238" cy="176" r="52" fill="url(#gold5)" opacity="0.9"/>

  <!-- warehouse block (left, low & wide) -->
  <g>
    <rect x="130" y="430" width="420" height="230" rx="10" fill="#0E3055" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"/>
    <g fill="#FFFFFF" fill-opacity="0.10">
      <rect x="168" y="486" width="58" height="58" rx="5"/>
      <rect x="244" y="486" width="58" height="58" rx="5"/>
      <rect x="320" y="486" width="58" height="58" rx="5"/>
      <rect x="396" y="486" width="58" height="58" rx="5"/>
    </g>
    <rect x="250" y="586" width="110" height="74" rx="5" fill="#FFFFFF" fill-opacity="0.14"/>
    <!-- rooftop array -->
    <g fill="url(#gold5)" stroke="#0A2540" stroke-opacity="0.3" stroke-width="3">
      <rect x="150" y="396" width="86" height="30" rx="4" transform="skewX(-14)"/>
      <rect x="248" y="396" width="86" height="30" rx="4" transform="skewX(-14)"/>
      <rect x="346" y="396" width="86" height="30" rx="4" transform="skewX(-14)"/>
      <rect x="444" y="396" width="86" height="30" rx="4" transform="skewX(-14)"/>
    </g>
  </g>

  <!-- tower block (right, tall) -->
  <g>
    <rect x="640" y="300" width="250" height="360" rx="10" fill="#0E3055" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"/>
    <g fill="#FFFFFF" fill-opacity="0.10">
      <rect x="676" y="350" width="52" height="46" rx="5"/><rect x="744" y="350" width="52" height="46" rx="5"/><rect x="812" y="350" width="52" height="46" rx="5"/>
      <rect x="676" y="416" width="52" height="46" rx="5"/><rect x="744" y="416" width="52" height="46" rx="5"/><rect x="812" y="416" width="52" height="46" rx="5"/>
      <rect x="676" y="482" width="52" height="46" rx="5"/><rect x="744" y="482" width="52" height="46" rx="5"/><rect x="812" y="482" width="52" height="46" rx="5"/>
      <rect x="676" y="548" width="52" height="46" rx="5"/><rect x="744" y="548" width="52" height="46" rx="5"/><rect x="812" y="548" width="52" height="46" rx="5"/>
    </g>
    <g fill="url(#gold5)" stroke="#0A2540" stroke-opacity="0.3" stroke-width="3">
      <rect x="656" y="266" width="94" height="28" rx="4" transform="skewX(-14)"/>
      <rect x="762" y="266" width="94" height="28" rx="4" transform="skewX(-14)"/>
    </g>
  </g>

  <!-- open access line to pylon -->
  <g stroke="#3FD0C9" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="20 16" opacity="0.85">
    <path d="M905 470 L1010 470"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M1030 660 L1058 424 L1086 660"/>
    <path d="M1042 566 L1074 566"/>
    <path d="M1014 452 L1102 452"/>
  </g>

  <line x1="90" y1="682" x2="1130" y2="682" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6" stroke-linecap="round"/>
</svg>
