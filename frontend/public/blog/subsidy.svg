<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rooftop solar subsidy illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/><stop offset="55%" stop-color="#12365C"/><stop offset="100%" stop-color="#0C2A4A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/><stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="20%" r="46%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.34"/><stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- sun -->
  <circle cx="905" cy="188" r="62" fill="url(#gold)" opacity="0.92"/>
  <g stroke="#F5A623" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <line x1="905" y1="86" x2="905" y2="58"/><line x1="905" y1="318" x2="905" y2="290"/>
    <line x1="803" y1="188" x2="775" y2="188"/><line x1="1035" y1="188" x2="1007" y2="188"/>
    <line x1="833" y1="116" x2="813" y2="96"/><line x1="997" y1="280" x2="977" y2="260"/>
    <line x1="977" y1="116" x2="997" y2="96"/><line x1="813" y1="280" x2="833" y2="260"/>
  </g>

  <!-- house -->
  <path d="M250 470 L470 336 L690 470" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 470 L300 630 L640 630 L640 470" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"/>

  <!-- panel array on roof -->
  <g transform="translate(300,352) rotate(-31.4)">
    <g fill="url(#gold)" stroke="#0A2540" stroke-opacity="0.35" stroke-width="3">
      <rect x="0"   y="0"  width="60" height="34" rx="4"/>
      <rect x="68"  y="0"  width="60" height="34" rx="4"/>
      <rect x="136" y="0"  width="60" height="34" rx="4"/>
      <rect x="0"   y="42" width="60" height="34" rx="4"/>
      <rect x="68"  y="42" width="60" height="34" rx="4"/>
      <rect x="136" y="42" width="60" height="34" rx="4"/>
    </g>
  </g>

  <!-- rupee badge -->
  <circle cx="700" cy="590" r="76" fill="#0A2540" stroke="url(#gold)" stroke-width="5"/>
  <text x="700" y="626" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="700" fill="url(#gold)">₹</text>

  <!-- rising bars -->
  <g fill="#2AA9A0" opacity="0.85">
    <rect x="828" y="590" width="34" height="52" rx="6"/>
    <rect x="880" y="556" width="34" height="86" rx="6"/>
    <rect x="932" y="512" width="34" height="130" rx="6"/>
  </g>
  <line x1="812" y1="660" x2="990" y2="660" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/>
</svg>
