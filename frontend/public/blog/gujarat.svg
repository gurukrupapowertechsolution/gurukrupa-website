<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Net metering and grid connection illustration">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/><stop offset="55%" stop-color="#11375E"/><stop offset="100%" stop-color="#0C2A4A"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/><stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.22"/><stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots3" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg3)"/>
  <rect width="1200" height="800" fill="url(#dots3)"/>
  <rect width="1200" height="800" fill="url(#glow3)"/>

  <!-- meter body -->
  <rect x="470" y="250" width="260" height="300" rx="22" fill="#0D2E51" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"/>
  <rect x="502" y="292" width="196" height="94" rx="10" fill="#071D33" stroke="url(#gold3)" stroke-width="3"/>
  <text x="600" y="358" text-anchor="middle" font-family="'Courier New', monospace" font-size="46" font-weight="700" fill="url(#gold3)" letter-spacing="4">0000</text>
  <circle cx="536" cy="452" r="15" fill="#3FD0C9"/>
  <circle cx="600" cy="452" r="15" fill="#FFFFFF" fill-opacity="0.28"/>
  <circle cx="664" cy="452" r="15" fill="#FFFFFF" fill-opacity="0.28"/>
  <text x="600" y="520" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" fill-opacity="0.45" letter-spacing="3">BIDIRECTIONAL</text>

  <!-- export arrow (right, gold) -->
  <path d="M760 340 L980 340" stroke="url(#gold3)" stroke-width="10" stroke-linecap="round"/>
  <path d="M952 312 L990 340 L952 368 Z" fill="url(#gold3)"/>
  <text x="872" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="url(#gold3)">EXPORT</text>

  <!-- import arrow (left, teal) -->
  <path d="M440 462 L220 462" stroke="#3FD0C9" stroke-width="10" stroke-linecap="round"/>
  <path d="M248 434 L210 462 L248 490 Z" fill="#3FD0C9"/>
  <text x="330" y="424" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#3FD0C9">IMPORT</text>

  <!-- pylon right -->
  <g stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M1050 620 L1080 400 L1110 620"/>
    <path d="M1062 540 L1098 540"/>
    <path d="M1070 476 L1090 476"/>
    <path d="M1030 430 L1130 430"/>
  </g>

  <!-- house left -->
  <g stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 560 L170 496 L250 560"/>
    <path d="M112 560 L112 640 L228 640 L228 560"/>
  </g>
  <g transform="translate(112,506) rotate(-38.6)" fill="url(#gold3)">
    <rect x="0"  y="0" width="34" height="20" rx="3"/>
    <rect x="40" y="0" width="34" height="20" rx="3"/>
  </g>

  <!-- ground -->
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6" stroke-linecap="round"/>
</svg>
