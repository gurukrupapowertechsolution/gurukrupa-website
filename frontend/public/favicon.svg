<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gurukrupa Powertech Solution">
  <!--
    Browser-tab icon for gurukrupapowertechsolution.in.

    Replaces Vite's default purple lightning mark, which shipped untouched from
    the day the project was scaffolded and was still live on 2026-09-02.

    Why this is not simply logo-mark.png: that file is 760x502, a 1.5:1
    rectangle. A favicon is rendered into a square box at 16px, so a wide logo
    is either letterboxed to about 10px tall or squashed — and the wordmark in
    it is unreadable at any tab size regardless. An icon at this scale has room
    for one idea, so this carries the sun alone, in the brand's own navy and
    gold (#0A2540 / #F5A623, the same tokens the site uses).

    Built from circles and rects rather than traced path data so it stays
    editable: to adjust the rays, change the <g> rotation set below.
  -->
  <rect width="64" height="64" rx="14" fill="#0A2540"/>

  <!-- Rays first, so the disc paints over their inner ends and they read as
       emanating from behind it rather than touching it. -->
  <g stroke="#F5A623" stroke-width="3.4" stroke-linecap="round">
    <line x1="32" y1="7"  x2="32" y2="14"/>
    <line x1="32" y1="50" x2="32" y2="57"/>
    <line x1="7"  y1="32" x2="14" y2="32"/>
    <line x1="50" y1="32" x2="57" y2="32"/>
    <line x1="14.4" y1="14.4" x2="19.3" y2="19.3"/>
    <line x1="44.7" y1="44.7" x2="49.6" y2="49.6"/>
    <line x1="14.4" y1="49.6" x2="19.3" y2="44.7"/>
    <line x1="44.7" y1="19.3" x2="49.6" y2="14.4"/>
  </g>

  <!-- The disc. A flat fill would go muddy at 16px against the navy; the
       off-centre gradient keeps a highlight visible even when the whole mark
       is 16 pixels wide. -->
  <defs>
    <radialGradient id="sun" cx="38%" cy="34%" r="72%">
      <stop offset="0%"   stop-color="#FFE0A3"/>
      <stop offset="55%"  stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D98D0F"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="12.5" fill="url(#sun)"/>
</svg>
